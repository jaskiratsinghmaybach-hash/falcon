[package]
name = "falcon"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
solana-sdk = "2"
solana-client = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
jito-sdk-rust = "0.3"
dotenvy = "0.15"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
solana-account-decoder = "2"
